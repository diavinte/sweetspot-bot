name: SweetSpot Deals Radar

on:
  schedule:
    - cron: '0 * * * *' # Executa no minuto 0 de cada hora (ex: 14:00, 15:00, 16:00)
  workflow_dispatch: # Permite disparar manualmente no botão "Run workflow"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py
